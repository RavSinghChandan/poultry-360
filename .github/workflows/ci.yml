name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Test
        # Includes the platform contract tests, which fail if a new feature
        # breaks isolation from an existing one.
        run: python -m pytest tests/ -q
      - name: Evals
        # Router and grounding-guard evals; fails if a score drops below its floor.
        run: python -m evals.run --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production
